<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Pixel Usage Desk</title>
<style>
  :root {
    --ink: #0a0c10;
    --case: #2b2f3a;
    --case-hi: #4a5160;
    --case-lo: #171a21;
    --screen: #07130c;
    --green: #3dff8b;
    --green-dim: #1f7a4a;
    --green-dark: #0f3d27;
    --amber: #ffb64d;
    --red: #ff5d5d;
    --paper: #d9ffe8;
    --muted: #6fbf92;
    --scan: rgba(0, 0, 0, .26);
    --vignette: rgba(0, 0, 0, .42);
    --glow: rgba(61, 255, 139, .09);
    --pixel-glow: rgba(61, 255, 139, .18);
    --shadow: rgba(0, 0, 0, .55);
    --rule: #123d28;
    --bar-empty: #0d2a1c;
    --seg-border: #06120c;
    --screen-inset: #143d28;
    --brand-shadow: #000;
    --led-off: #3a1d1d;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --ink: #4a4033;
      --case: #ddd5c0;
      --case-hi: #f5efdd;
      --case-lo: #bfb7a2;
      --screen: #d8e4b8;
      --green: #2f6b3a;
      --green-dim: #5b7a4e;
      --green-dark: #93a77f;
      --amber: #8a5a12;
      --red: #8a2a2a;
      --paper: #1f2d1b;
      --muted: #4d6644;
      --scan: rgba(30, 50, 25, .10);
      --vignette: rgba(40, 60, 30, .16);
      --glow: rgba(47, 107, 58, .10);
      --pixel-glow: rgba(47, 107, 58, .14);
      --shadow: rgba(40, 35, 25, .35);
      --rule: #9ba989;
      --bar-empty: #b7c49f;
      --seg-border: #8f9b7c;
      --screen-inset: #a9b98f;
      --brand-shadow: #f5efdd;
      --led-off: #c9b7a7;
    }
  }
  html[data-theme="light"] {
    --ink: #4a4033;
    --case: #ddd5c0;
    --case-hi: #f5efdd;
    --case-lo: #bfb7a2;
    --screen: #d8e4b8;
    --green: #2f6b3a;
    --green-dim: #5b7a4e;
    --green-dark: #93a77f;
    --amber: #8a5a12;
    --red: #8a2a2a;
    --paper: #1f2d1b;
    --muted: #4d6644;
    --scan: rgba(30, 50, 25, .10);
    --vignette: rgba(40, 60, 30, .16);
    --glow: rgba(47, 107, 58, .10);
    --pixel-glow: rgba(47, 107, 58, .14);
    --shadow: rgba(40, 35, 25, .35);
    --rule: #9ba989;
    --bar-empty: #b7c49f;
    --seg-border: #8f9b7c;
    --screen-inset: #a9b98f;
    --brand-shadow: #f5efdd;
    --led-off: #c9b7a7;
  }
  html[data-theme="dark"] {
    --ink: #0a0c10;
    --case: #2b2f3a;
    --case-hi: #4a5160;
    --case-lo: #171a21;
    --screen: #07130c;
    --green: #3dff8b;
    --green-dim: #1f7a4a;
    --green-dark: #0f3d27;
    --amber: #ffb64d;
    --red: #ff5d5d;
    --paper: #d9ffe8;
    --muted: #6fbf92;
    --scan: rgba(0, 0, 0, .26);
    --vignette: rgba(0, 0, 0, .42);
    --glow: rgba(61, 255, 139, .09);
    --pixel-glow: rgba(61, 255, 139, .18);
    --shadow: rgba(0, 0, 0, .55);
    --rule: #123d28;
    --bar-empty: #0d2a1c;
    --seg-border: #06120c;
    --screen-inset: #143d28;
    --brand-shadow: #000;
    --led-off: #3a1d1d;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    padding: 10px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, "Courier New", monospace;
  }
  .desk {
    width: 280px;
    color: var(--paper);
    position: relative;
  }
  .case {
    background: var(--case);
    border: 2px solid var(--ink);
    padding: 5px 2px 2px;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .bezel {
    background: var(--case-lo);
    border: 2px solid var(--ink);
    padding: 3px;
  }
  .head {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 2px 3px;
    cursor: default;
  }
  .brand {
    font-size: 9px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--paper);
    text-shadow: 1px 1px 0 var(--brand-shadow);
  }
  .tag {
    font-size: 7px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--green-dim);
    border: 1px solid var(--green-dim);
    padding: 1px 2px;
  }
  .led {
    width: 6px;
    height: 6px;
    flex: none;
    background: var(--led-off);
    border: 1px solid var(--ink);
  }
  .led.on {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: blink 2s steps(2, end) infinite;
  }
  .led.warn { background: var(--amber); box-shadow: 0 0 5px var(--amber); }
  .led.off { background: var(--red); box-shadow: 0 0 5px var(--red); }
  .live {
    font-size: 8px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .grow { flex: 1; }
  .btn {
    appearance: none;
    border: 1px solid var(--ink);
    background: var(--case);
    color: var(--paper);
    font-family: inherit;
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    padding: 3px 4px;
    cursor: pointer;
    box-shadow: inset 1px 1px 0 var(--case-hi), inset -1px -1px 0 var(--ink);
  }
  .btn:hover { background: var(--case-hi); }
  .btn:active { transform: translate(1px, 1px); }
  .screen {
    position: relative;
    overflow: hidden;
    padding: 6px 7px 4px;
    background: var(--screen);
    border: 2px solid var(--ink);
    box-shadow: inset 0 0 0 1px var(--screen-inset), inset 0 0 20px var(--glow);
  }
  .screen::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 50%, var(--vignette) 100%);
  }
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 3px);
  }
  .screen > * { position: relative; z-index: 1; }
  .row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 6px;
    margin: 0 0 2px;
  }
  .label {
    font-size: 8px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--muted);
  }
  .pixels { display: block; color: var(--paper); filter: drop-shadow(0 0 3px var(--pixel-glow)); }
  .pixels svg { display: block; max-width: 100%; height: auto; }
  .pct {
    font-size: 10px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--paper);
  }
  .sub {
    display: flex;
    justify-content: space-between;
    gap: 5px;
    margin-bottom: 2px;
    font-size: 8px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--green-dim);
    white-space: nowrap;
  }
  .sub.three { gap: 3px; }
  .rule { height: 1px; background: var(--rule); margin: 3px 0; }
  .bar { display: flex; gap: 2px; height: 7px; margin: 2px 0 2px; color: var(--green); }
  .bar.amber { color: var(--amber); }
  .bar.red { color: var(--red); }
  .seg { flex: 1; min-width: 0; background: var(--bar-empty); border: 1px solid var(--seg-border); }
  .seg.on { background: currentColor; box-shadow: 0 0 4px currentColor; }
  .ticks {
    display: grid;
    grid-template-columns: repeat(24, 1fr);
    gap: 1px;
    height: 10px;
    align-items: end;
    margin: 3px 0 1px;
  }
  .tick { display: block; width: 100%; min-height: 2px; background: var(--green-dim); }
  .tick.hot { background: var(--green); }
  .foot {
    display: flex;
    justify-content: space-between;
    gap: 5px;
    margin-top: 2px;
    padding-top: 2px;
    border-top: 1px dashed var(--rule);
    font-size: 8px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: .01em;
    color: var(--green-dim);
    white-space: nowrap;
  }
  .foot:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .stand {
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  .stand i {
    display: block;
    background: var(--case);
    border: 2px solid var(--ink);
    border-top: 0;
  }
  .stand i:first-child { width: 38px; height: 8px; }
  .stand i:last-child { width: 92px; height: 5px; }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: .35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .led.on { animation: none; }
  }
</style>
</head>
<body>
<div class="desk" id="desk">
  <div class="case">
    <div class="bezel">
      <header class="head" id="head">
        <span class="brand">PIXEL DESK</span>
        <span class="tag">APP</span>
        <span class="led warn" id="led"></span>
        <span class="live" id="live">SYNC</span>
        <span class="grow"></span>
        <button class="btn" id="sync" title="刷新余额与用量">↻</button>
        <button class="btn" id="hide" title="隐藏到 Dock / 菜单栏">×</button>
      </header>
      <div class="screen">
        <div class="row">
          <span class="label">AVAILABLE</span>
          <span class="pixels" id="balance"></span>
        </div>
        <div class="sub">
          <span id="bonus">BONUS --</span>
          <span id="spent">SPENT --</span>
        </div>
        <div class="rule"></div>
        <div class="row">
          <span class="label" id="sessionLabel">SESSION</span>
          <span class="pixels" id="tokens"></span>
        </div>
        <div class="sub three">
          <span id="in">IN 0</span>
          <span id="out">OUT 0</span>
          <span id="cache">CACHE 0</span>
        </div>
        <div class="rule"></div>
        <div class="row">
          <span class="label">CONTEXT</span>
          <span class="pct" id="pct">--</span>
        </div>
        <div class="bar" id="bar"></div>
        <div class="sub">
          <span id="ctxdetail">--</span>
          <span id="run">IDLE</span>
        </div>
        <div class="ticks" id="ticks"></div>
        <div class="foot">
          <span id="all">ALL 0</span>
          <span id="rate">RATE 0</span>
        </div>
        <div class="foot">
          <span id="updated">UPDATED --:--:--</span>
          <span id="mode">LIVE</span>
        </div>
      </div>
    </div>
    <div class="stand"><i></i><i></i></div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var GLYPHS = {
    '0': ['01110','10001','10011','10101','11001','10001','01110'],
    '1': ['00100','01100','00100','00100','00100','00100','01110'],
    '2': ['01110','10001','00001','00010','00100','01000','11111'],
    '3': ['11110','00001','00001','01110','00001','00001','11110'],
    '4': ['00010','00110','01010','10010','11111','00010','00010'],
    '5': ['11111','10000','11110','00001','00001','10001','01110'],
    '6': ['00110','01000','10000','11110','10001','10001','01110'],
    '7': ['11111','00001','00010','00100','01000','01000','01000'],
    '8': ['01110','10001','10001','01110','10001','10001','01110'],
    '9': ['01110','10001','10001','01111','00001','00010','01100'],
    '.': ['00000','00000','00000','00000','00000','00110','00110'],
    ':': ['00000','00110','00110','00000','00110','00110','00000'],
    '/': ['00001','00010','00010','00100','01000','01000','10000'],
    '%': ['11001','11010','00010','00100','01000','01011','10011'],
    'K': ['10001','10010','10100','11000','10100','10010','10001'],
    'M': ['10001','11011','10101','10101','10001','10001','10001'],
    'B': ['11110','10001','10001','11110','10001','10001','11110'],
    '¥': ['10001','01010','00100','11111','00100','11111','00100'],
    '$': ['00100','01111','10100','01110','00101','11110','00100'],
    '-': ['00000','00000','00000','11111','00000','00000','00000'],
    '+': ['00000','00100','00100','11111','00100','00100','00000'],
    '?': ['01110','10001','00001','00010','00100','00000','00100'],
    ' ': ['00000','00000','00000','00000','00000','00000','00000']
  };

  var W = 5;
  var H = 7;

  function svgText(value, scale) {
    var text = String(value == null ? '--' : value).toUpperCase();
    var chars = text.split('');
    var width = Math.max(1, chars.length * (W + 1) - 1);
    var parts = [];
    for (var i = 0; i < chars.length; i += 1) {
      var rows = GLYPHS[chars[i]] || GLYPHS['?'];
      var ox = i * (W + 1);
      for (var y = 0; y < H; y += 1) {
        var row = rows[y] || '00000';
        for (var x = 0; x < W; x += 1) {
          if (row.charAt(x) === '1') {
            parts.push('<rect x="' + (ox + x) + '" y="' + y + '" width="1" height="1" fill="currentColor"/>');
          }
        }
      }
    }
    return '<svg viewBox="0 0 ' + width + ' ' + H + '" width="' + (width * scale) +
      '" height="' + (H * scale) + '" shape-rendering="crispEdges" aria-hidden="true" focusable="false">' +
      parts.join('') + '</svg>';
  }

  function setPixels(id, value, scale) {
    var el = document.getElementById(id);
    if (!el) return;
    var key = String(value) + '|' + scale;
    if (el.dataset.key === key) return;
    el.dataset.key = key;
    el.innerHTML = svgText(value, scale);
  }

  function setText(id, value) {
    var el = document.getElementById(id);
    if (el && el.textContent !== String(value)) el.textContent = String(value);
  }

  function fmtTokens(value) {
    var n = Number(value);
    if (!isFinite(n) || n < 0) n = 0;
    if (n < 1000) return String(Math.round(n));
    if (n < 1e6) {
      var k = n / 1e3;
      return (k < 10 ? k.toFixed(1) : String(Math.round(k))) + 'K';
    }
    if (n < 1e9) {
      var m = n / 1e6;
      return (m < 10 ? m.toFixed(2) : m.toFixed(1)) + 'M';
    }
    return (n / 1e9).toFixed(1) + 'B';
  }

  function fmtMoney(value, currency) {
    var n = Number(value);
    if (!isFinite(n)) n = 0;
    return (currency === 'USD' ? '$' : '¥') + n.toFixed(2);
  }

  function fmtClock(ms) {
    if (!ms) return '--:--:--';
    var d = new Date(ms);
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function toneFor(pct) {
    if (pct == null || !isFinite(pct)) return '';
    if (pct >= 85) return 'red';
    if (pct >= 60) return 'amber';
    return '';
  }

  var rate = 0;
  var ticks = [];
  var lastId = null;
  var lastTotal = 0;
  var lastBucket = 0;
  var samples = [];

  function resetTicker() {
    rate = 0;
    ticks = new Array(24).fill(0);
    lastId = null;
    lastTotal = 0;
    lastBucket = 0;
    samples = [];
  }

  function track(current, now) {
    if (!current || typeof current.total !== 'number') {
      lastId = null;
      return;
    }
    if (current.id !== lastId) {
      lastId = current.id;
      lastTotal = current.total;
      lastBucket = now;
      samples = [{ t: now, total: current.total }];
      ticks = new Array(24).fill(0);
      return;
    }
    if (lastBucket === 0) {
      lastBucket = now;
      lastTotal = current.total;
    }
    if (now - lastBucket >= 5000) {
      var delta = Math.max(0, current.total - lastTotal);
      ticks.push(delta);
      while (ticks.length > 24) ticks.shift();
      lastTotal = current.total;
      lastBucket = now;
      samples.push({ t: now, total: current.total });
      while (samples.length > 2 && now - samples[0].t > 60000) samples.shift();
      if (samples.length >= 2) {
        var first = samples[0];
        var last = samples[samples.length - 1];
        var span = last.t - first.t;
        if (span > 0) rate = Math.max(0, (last.total - first.total) * 60000 / span);
      }
    }
  }

  function renderTicks() {
    var host = document.getElementById('ticks');
    if (host.childNodes.length !== 24) {
      host.innerHTML = '';
      for (var i = 0; i < 24; i += 1) {
        var bar = document.createElement('i');
        bar.className = 'tick';
        host.appendChild(bar);
      }
    }
    var max = 1;
    for (var j = 0; j < ticks.length; j += 1) if (ticks[j] > max) max = ticks[j];
    for (var k = 0; k < host.childNodes.length; k += 1) {
      var value = ticks[k] || 0;
      var height = value > 0 ? Math.max(8, Math.round(value / max * 100)) : 0;
      host.childNodes[k].style.height = height + '%';
      host.childNodes[k].className = 'tick' + (value > 0 && k >= 21 ? ' hot' : '');
    }
  }

  function renderBar(pct) {
    var host = document.getElementById('bar');
    if (host.childNodes.length !== 16) {
      host.innerHTML = '';
      for (var i = 0; i < 16; i += 1) {
        var seg = document.createElement('i');
        seg.className = 'seg';
        host.appendChild(seg);
      }
    }
    var value = pct == null || !isFinite(pct) ? 0 : Math.max(0, Math.min(100, pct));
    var filled = Math.round(value / 100 * 16);
    for (var j = 0; j < host.childNodes.length; j += 1) {
      host.childNodes[j].className = 'seg' + (j < filled ? ' on' : '');
    }
    host.className = 'bar ' + toneFor(value);
  }

  function statusLabel(status) {
    if (status === 'ready') return 'LIVE';
    if (status === 'signed-out') return 'NO ACCOUNT';
    if (status === 'error') return 'OFFLINE';
    return 'SYNC';
  }

  function update(data) {
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch (e) { return; }
    }
    if (!data || typeof data !== 'object') return;

    var status = data.status || 'unknown';
    var balance = data.balance || {};
    var usage = data.usage || {};
    var current = usage.current || null;
    var now = Date.now();

    var available = Number(balance.available);
    var currency = balance.currency || 'CNY';
    var signedOut = status === 'signed-out';
    var balanceValue = signedOut ? '--' : (isFinite(available) ? fmtMoney(available, currency) : '--');
    setPixels('balance', balanceValue, 3);

    var bonusValue = Number(balance.bonus);
    var spentValue = Number(balance.spent);
    setText('bonus', 'BONUS ' + (signedOut ? '--' : (isFinite(bonusValue) ? fmtMoney(bonusValue, currency) : '--')));
    setText('spent', 'SPENT ' + (isFinite(spentValue) ? fmtMoney(spentValue, currency) : '--'));

    var total = current && typeof current.total === 'number' ? current.total : 0;
    setPixels('tokens', fmtTokens(total), 2);
    setText('in', 'IN ' + fmtTokens(current ? current.input : 0));
    setText('out', 'OUT ' + fmtTokens(current ? current.output : 0));
    setText('cache', 'CACHE ' + fmtTokens(current ? (current.cacheRead + current.cacheWrite) : 0));

    var used = current && typeof current.contextUsed === 'number' ? current.contextUsed : null;
    var contextWindow = current && typeof current.contextWindow === 'number' ? current.contextWindow : null;
    var pct = used != null && contextWindow != null && contextWindow > 0 ? Math.min(100, used / contextWindow * 100) : null;
    setText('pct', pct == null ? '--' : Math.round(pct) + '%');
    renderBar(pct);
    setText('ctxdetail', used != null && contextWindow != null ? fmtTokens(used) + ' / ' + fmtTokens(contextWindow) : '--');
    setText('run', current ? 'LIVE' : 'IDLE');
    setText('all', 'ALL ' + fmtTokens(usage.allTotal));
    setText('rate', 'RATE ' + (rate > 0 ? fmtTokens(rate) + '/M' : '0'));
    setText('updated', 'UPDATED ' + fmtClock(usage.updatedAt));
    setText('mode', statusLabel(status));
    setText('live', status === 'ready' ? 'LIVE' : (status === 'signed-out' ? 'NO ACC' : 'SYNC'));

    var led = document.getElementById('led');
    led.className = 'led ' + (status === 'ready' ? 'on' : (status === 'signed-out' || status === 'error' ? 'off' : 'warn'));

    var label = document.getElementById('sessionLabel');
    if (current && current.title) {
      label.title = current.title;
    } else {
      label.title = '当前会话';
    }

    track(current, now);
    renderTicks();
  }

  function setTheme(mode) {
    var root = document.documentElement;
    if (mode === 'light' || mode === 'dark') {
      root.dataset.theme = mode;
    } else {
      delete root.dataset.theme;
    }
  }

  function send(type) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.desk) {
        window.webkit.messageHandlers.desk.postMessage({ type: type });
      }
    } catch (e) {
      /* the standalone window always provides the handler */
    }
  }

  document.getElementById('hide').addEventListener('click', function () { send('hide'); });
  document.getElementById('sync').addEventListener('click', function () { send('refresh'); });
  document.addEventListener('contextmenu', function (event) { event.preventDefault(); });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') send('hide');
  });

  resetTicker();
  update({
    status: 'unknown',
    balance: { currency: 'CNY', normal: 0, bonus: 0, available: 0, spent: 0 },
